name: delicid
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Diplomata
      fonts:
        - asset: font/Diplomata-Regular.ttf

    - family: Palace
      fonts:
        - asset: font/Palace.ttf

    - family: AbrilFatface
      fonts:
        - asset: font/AbrilFatface-Regular.ttf

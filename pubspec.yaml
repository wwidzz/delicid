name: delicid
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1

  shimmer: ^3.0.0                  # Tugas Dev 1
  cached_network_image: ^3.3.1     # Tugas Dev 1
  carousel_slider: ^5.0.0          # Tugas Dev 2
  shared_preferences: ^2.2.3       # Tugas Dev 3
  flutter_rating_bar: ^4.0.1       # Tugas Dev 4
  share_plus: ^10.0.0              # Tugas Dev 4
  awesome_snackbar_content: ^0.1.3 # Tugas Dev 5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Diplomata
      fonts:
        - asset: font/Diplomata-Regular.ttf

    - family: Palace
      fonts:
        - asset: font/Palace.ttf

    - family: AbrilFatface
      fonts:
        - asset: font/AbrilFatface-Regular.ttf
